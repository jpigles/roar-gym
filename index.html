<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e68">
<meta name="description" content="Gym log for the Roar volleyball strength and conditioning programs.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roar Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Roar Gym Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, a fixed dock at the bottom (next set / rest timer over three tabs), cards only for things you tap. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e7ecea; --line:#d3dbd8;
  --fg:#12201e; --muted:#586966; --accent:#d9541e; --on-accent:#ffffff;
  --court:#0f6e68; --ok:#1c7a4a; --warn:#a15c00; --danger:#b3261e;
  --fig:#12201e; --fig-far:#9aa9a5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1514; --surface:#15211f; --sunk:#1d2c2a; --line:#2b3d3a;
  --fg:#e9f0ee; --muted:#93a5a1; --accent:#ff7a3d; --on-accent:#1a0d05;
  --court:#4fc4ba; --ok:#5fd093; --warn:#f0b354; --danger:#ff8a80;
  --fig:#e9f0ee; --fig-far:#5a6d69; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c1514; --surface:#15211f; --sunk:#1d2c2a; --line:#2b3d3a;
  --fg:#e9f0ee; --muted:#93a5a1; --accent:#ff7a3d; --on-accent:#1a0d05;
  --court:#4fc4ba; --ok:#5fd093; --warn:#f0b354; --danger:#ff8a80;
  --fig:#e9f0ee; --fig-far:#5a6d69; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 200px;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;letter-spacing:.01em}
h1{font-size:2rem;font-weight:700;text-transform:uppercase}
h2{font-size:1.45rem;font-weight:600;text-transform:uppercase}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-family:var(--display);font-size:.95rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--court)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--court);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase}
.btn-ghost{background:transparent} .btn-danger{color:var(--danger)}
.btn-wide{width:100%}
.chip{min-height:36px;padding:4px 12px;border-radius:99px;font-size:.85rem}
.ss-ex{border-top:1px solid var(--line);padding-top:12px;gap:6px}
.round{border-top:1px solid var(--line);padding-top:12px;gap:8px}
.ss .set .i{font-weight:700;font-size:.8rem}
.pin{font-size:1.4rem;letter-spacing:.3em;text-align:center}
.who-row{display:flex;flex-wrap:wrap;gap:8px}
.who{min-height:44px;padding:8px 16px;border-radius:99px}
.who[aria-pressed="true"]{background:var(--court);border-color:transparent;color:#fff}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;padding:6px 8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.hi{border-color:var(--court);border-width:2px}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.weeks button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.weeks b{font-family:var(--display);font-size:1.5rem;line-height:1}
.weeks span{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.1}
.weeks button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--bg)}
.weeks button[aria-pressed="true"] span{color:var(--bg)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.dots i.on{background:currentColor;opacity:1}
.day{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px}
.day .n{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1;color:var(--accent);min-width:1.1ch}
.pill{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok);color:var(--bg)} .pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.cue{border-left:3px solid var(--court);padding:2px 0 2px 10px}
.ex{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.code{font-family:var(--display);font-weight:700;font-size:1.3rem;background:var(--fg);color:var(--bg);border-radius:8px;padding:2px 8px;line-height:1.3}
.target{font-family:var(--display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:1.6rem 1fr 1fr 4.6rem;gap:6px;align-items:center}
.set .i{font-family:var(--display);font-size:1.2rem;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 8px;text-align:center;font-size:1.05rem;font-variant-numeric:tabular-nums}
.set.done input{background:var(--sunk);border-color:transparent}
.set button{padding:6px}
.set.next button{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.set.done button{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.nw{grid-template-columns:1.6rem 1fr 4.6rem}
.set-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.demo{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fig{width:100%;max-width:380px;aspect-ratio:100/86;align-self:center;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig canvas,.fig svg{display:block;width:100%;height:100%}
.demo ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px}
a{color:var(--court);font-weight:600}
.linkbtn{border:0;background:none;padding:0;min-height:0;color:var(--court);text-decoration:underline;font-weight:600}
.warm li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.warm ul{list-style:none;margin:0;padding:0}
.warm input[type=checkbox]{width:24px;height:24px;margin-top:2px;accent-color:var(--court);flex:none}
details>summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
textarea.note{min-height:70px;font-family:var(--body);font-size:1rem}
select,.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--court)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto}
.tabs{display:flex}
.tabs button{flex:1;border:0;border-radius:0;background:none;min-height:54px;font-family:var(--display);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}
.now{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.now .clock{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.now.go .clock{color:var(--ok)}
.now-label{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:500;min-height:44px;justify-content:center}
.now-label b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.now .bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.now .bar i{display:block;height:100%;background:var(--accent)}
.stat{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat.sm{font-size:1.5rem}
.tabs.t4 button{font-size:1rem;letter-spacing:.03em}
.rank{display:grid;grid-template-columns:1.6rem 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font-family:var(--display);font-size:1.2rem;color:var(--muted);text-align:center}
.rank.me .who-n{color:var(--court)}
.rank .v{font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rank .dots{color:var(--court)}
.rank .dots i{width:11px;height:11px;border-width:2px;opacity:1}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:6px 4px;border-top:1px solid var(--line);font-size:.9rem;vertical-align:top}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:600;z-index:30;max-width:90vw}
</style>
</head>
<body>


<div id="app"></div>
<div class="dock"><div class="dock-in">
  <div id="now" class="now" hidden>
    <div class="clock" id="now-clock"></div>
    <button class="now-label" data-act="goto-next" aria-label="Go to the next set"><span class="small muted" id="now-top"></span><b id="now-name"></b><span class="bar" id="now-barwrap"><i id="now-bar"></i></span></button>
    <button id="now-add" data-act="rest-add" aria-label="Add 15 seconds">+15</button>
    <button id="now-skip" data-act="rest-skip">Skip</button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-train" data-act="tab" data-v="train">Train</button>
    <button id="tab-progress" data-act="tab" data-v="progress">Progress</button>
    <button id="tab-team" data-act="tab" data-v="team" hidden>Team</button>
    <button id="tab-programs" data-act="tab" data-v="programs">Programs</button>
  </nav>
</div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* ============ On-device PDF reader ============
   Turns a coach's PDF into a program on the phone itself: no AI service, nothing is uploaded.
   It reads the text with pdf.js, follows the table layout (Code / Movement / Sets x Reps / Rest / Focus),
   and matches each exercise to the demos and instructions the app already knows. */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load the PDF reader. Check your connection and try again.'));document.head.appendChild(s)})}
async function pdfItems(buf){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); await loadScript(PDFJS+'pdf.worker.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js' }
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise, items=[];
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p), tc=await pg.getTextContent();
    tc.items.forEach(i=>{ if(i.str) items.push({p,s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,f:i.fontName}) })}
  return items;
}
/* glue the PDF's text fragments into runs (one table cell or one line of a paragraph); b = bold */
function toRuns(items){
  const bold=new Set(); items.forEach(i=>{const t=i.s.trim(); if(/^(DAY\s*\d+\s*:|Week\s*\d+\s*:)/i.test(t)||/^[A-F]\d$/.test(t)) bold.add(i.f)});
  const runs=[]; let r=null;
  items.forEach(i=>{

function chartSVG(pts,label){

  const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ');
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), lastP=pts[pts.length-1];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(label)}">`;

  s+=`<path d="${d}" fill="none" stroke="var(--court)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((q,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(q.v)}" r="${i===pts.length-1?5:3}" fill="var(${i===pts.length-1?'--accent':'--court'})"/>`});
  s+=`<text x="${l}" y="${H-6}">${esc(fmtDate(pts[0].d))}</text>`+(pts.length>1?`<text x="${W-r}" y="${H-6}" text-anchor="end">${esc(fmtDate(lastP.d))}</text>`:'')+`</svg>`;

/* ============ Team board (installed app, signed in) ============
   Each person who joins the board uploads a small summary of their own log (doc "app/board"): when they trained, sets, reps and
   weight moved per workout for the last 10 weeks, and first / latest / best top weight per lift, all in kg. Nothing else leaves
   the private log: no notes, no body weight, no jump tests. Everyone signed in can read those summaries (team_board function).
   Joining is a choice: settings.board is undefined until the person answers, true = on the board, false = not. */

  const progs=allPrograms(), f=finished().filter(s=>(progs[s.pid]||{}).team!=='beach'), since=Date.now()-70*864e5, kg=(v,s)=>+conv(v,unitOf(s),'kg');
  const s=f.filter(x=>x.finishedAt>since).map(x=>{let n=0,r=0,v=0; Object.values(x.sets).forEach(a=>a.forEach(q=>{ if(!q||!q.done) return; n++; const rr=num(q.r)||0, ww=num(q.w); r+=rr; if(ww!=null) v+=kg(ww,x)*rr })); return {t:x.finishedAt,n,r,v:Math.round(v)}});

  const pr=allPrograms()[activeId('indoor')], ps=pr?progState(pr.id):{week:1,cycle:1};
  return {v:1,split:S.settings.split===3?3:2,week:ps.week,weeks:pr?pr.weeks.length:4,cycle:ps.cycle,s,lifts};
}

const fixHow=o=>{ if(typeof o.how==='string') o.how=[o.how]; if(Array.isArray(o.how)) o.how=o.how.map(String); else delete o.how };

function validateProgram(o){
  if(!o||typeof o!=='object') return 'That is not a program.';
  if(!o.id||!o.name) return 'The program needs an "id" and a "name".';
  if(o.team!=='indoor'&&o.team!=='beach') return '"team" must be "indoor" or "beach".';
  if(!Array.isArray(o.days)||!o.days.length) return 'The program has no days.';
  for(const d of o.days){ if(!d||typeof d!=='object'||!d.id||!d.title||!Array.isArray(d.items)||!d.items.length) return 'Every day needs an id, a title and at least one exercise.';
    for(const it of d.items){ if(!fixItem(it)) return 'Every exercise needs a code and a name.'; } }
  if(o.roles&&typeof o.roles==='object'&&!Array.isArray(o.roles)){
    for(const k of Object.keys(o.roles)){const r=o.roles[k]; if(!r||!Array.isArray(r.items)||!r.items.length||!r.items.every(fixItem)) delete o.roles[k]; else r.name=String(r.name||k)}
    if(!Object.keys(o.roles).length) delete o.roles;
  } else delete o.roles;
  if(!Array.isArray(o.weeks)||!o.weeks.length) o.weeks=[{title:'Train',note:'Follow the prescribed sets and reps.'}];
  o.weeks=o.weeks.map((w,i)=>{w=w&&typeof w==='object'?w:{}; w.title=String(w.title||'Week '+(i+1)); w.note=String(w.note||''); return w});
  const ids={}; o.days.forEach((d,i)=>{d.id=String(d.id); if(ids[d.id]) d.id+='-'+(i+1); ids[d.id]=1; d.title=String(d.title)});
  o.name=String(o.name);
  o.warmup=(Array.isArray(o.warmup)?o.warmup:[]).filter(w=>w&&typeof w==='object'&&w.name); o.warmup.forEach(fixHow);
  o.cues=(Array.isArray(o.cues)?o.cues:[]).filter(c=>c&&typeof c==='object');

}

        S.measures=mergeMeasures(S.measures,{list:o.measures.list.filter(x=>x&&x.id).map(x=>{x=Object.assign({},x); if(!MT[x.type]) return null; if(!MT[x.type].u&&!x.u&&bu) x.u=bu; if(gone.includes(x.id)) x.id+='r'; return x}).filter(Boolean),deleted:gone});saveMeasures()}
      ui.restoreText='';
      saveSettings(); Object.values(S.sessions).forEach(s=>queue('sessions/'+s.id,s)); Object.values(S.programs).forEach(x=>queue('programs/'+x.id,x)); render(); toast('Backup restored');
    }catch(e){toast('That does not look like a backup from this app')}
  },
  import(){
    let txt=$('import-text').value.trim(), o;
    const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a>=0&&b>a) txt=txt.slice(a,b+1);
    try{o=JSON.parse(txt)}catch(e){ui.importErr='Could not read that. Paste the whole JSON block Claude gave you, from the first { to the last }.';render();return}
    const err=validateProgram(o); if(err){ui.importErr=err;render();return}
    if(BUILTINS[o.id]) o.id+='-new';
    S.settings.deletedProgs=(S.settings.deletedProgs||[]).filter(id=>id!==o.id);
    ui.importErr='';ui.importText='';S.programs[o.id]=o;S.settings.active[o.team]=o.id;S.settings.team=o.team;saveProgram(o);saveSettings();ui.view='train';render();window.scrollTo(0,0);toast(o.name+' added')
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b) return; const f=ACT[b.dataset.act]; if(f) f(b.dataset);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sess-note'&&S.current){S.current.note=t.value;saveCurrent();return}
  if(t.id==='import-text'){ui.importText=t.value;return}
  if(t.id==='pdf-name'&&ui.pdf&&ui.pdf.draft){ui.pdf.draft.name=t.value;return}
  if(t.id==='restore-text'){ui.restoreText=t.value;return}
  if(t.dataset&&t.dataset.k&&S.current){const rows=S.current.sets[t.dataset.k]||(S.current.sets[t.dataset.k]=[]), i=+t.dataset.i; while(rows.length<=i) rows.push({});
    const v=t.value.trim().replace(',','.'); rows[i][t.dataset.f]=v===''?null:(isNaN(+v)?v:+v); if(t.dataset.f==='w') delete rows[i].o; saveCurrent();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.warmI!=null&&S.current){S.current.warm[t.dataset.warmI]=t.checked;saveCurrent();
    const pr=allPrograms()[S.current.pid]; if(pr.warmup.every((w,i)=>S.current.warm[i])) ui.warmOpen=false; render();}
  if(t.id==='exsel'){ui.exSel=t.value;render()}
  if(t.id==='bex'){ui.bEx=t.value;render()}
  if(t.dataset&&t.dataset.roleSel!=null) ACT.role({v:t.value});
  if(t.id==='pdf-file'&&t.files&&t.files[0]) readPdfFile(t.files[0]);
});
document.addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details[data-warm]')) ui.warmOpen=e.target.open; },true);

render(); requestAnimationFrame(figFrame);
</script>

<script>if('serviceWorker' in navigator) addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
